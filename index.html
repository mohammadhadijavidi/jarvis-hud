<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Jarvis HUD: a cinematic browser interface for voice AI assistants." />
    <title>Jarvis HUD</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="hud" id="hud" data-state="idle">
      <canvas class="core" id="core" aria-hidden="true"></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scan" aria-hidden="true"></div>

      <header class="bar">
        <div class="brand">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".5" />
            <circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="12" cy="12" r="1.8" fill="currentColor" />
          </svg>
          <span>Jarvis HUD</span>
        </div>
        <dl class="telemetry" id="telemetry">
          <div><dt>Link</dt><dd id="t-link">Connecting</dd></div>
          <div><dt>Backend</dt><dd id="t-backend">-</dd></div>
          <div><dt>Model</dt><dd id="t-model">-</dd></div>
          <div><dt>Turns</dt><dd id="t-turns">0</dd></div>
          <div><dt>Session</dt><dd id="t-clock">00:00</dd></div>
        </dl>
        <p class="sim" id="sim" hidden>Simulated responses</p>
      </header>

      <section class="panel log" aria-label="Transcript">
        <h2>Transcript</h2>
        <ol class="utterances" id="transcript" aria-live="polite"></ol>
        <p class="empty" id="transcript-empty">Say something or type below. The conversation appears here.</p>
      </section>

      <section class="panel ops" aria-label="Tool calls">
        <h2>Tool calls <span class="count" id="tool-count">0</span></h2>
        <ol class="tools" id="tools"></ol>
        <p class="empty" id="tools-empty">When the assistant uses a tool, its arguments and result show up here.</p>
      </section>

      <div class="readout" aria-live="polite">
        <p class="state" id="state-word">Standing by</p>
        <p class="caption" id="caption"></p>
      </div>

      <form class="console" id="console" autocomplete="off">
        <button type="button" class="mic" id="mic" aria-pressed="false" aria-label="Start microphone">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </button>
        <label class="sr-only" for="prompt">Message</label>
        <input id="prompt" name="prompt" placeholder="Ask for the time in Tokyo, run diagnostics, or calculate 18% of 4,250" />
        <button type="submit" class="send">Send</button>
      </form>

      <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
      <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
