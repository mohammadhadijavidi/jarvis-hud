<!doctype html>
<html><head><meta charset="utf-8"><title>Jarvis HUD flow</title>
<style>
@font-face { font-family: CP; font-weight: 500; src: url(../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-500-normal.woff2); }
@font-face { font-family: CP; font-weight: 600; src: url(../node_modules/@fontsource/chakra-petch/files/chakra-petch-latin-600-normal.woff2); }
@font-face { font-family: Plex; font-weight: 400; src: url(../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2); }
html,body{margin:0;background:#020a12}
body{width:1600px;height:900px;font-family:Plex,sans-serif;color:#dcefff;
 background:radial-gradient(900px 600px at 50% 45%,#061724,transparent 70%),#020a12}
svg{display:block}
.t{font-family:CP;font-weight:600;font-size:22px;fill:#dcefff}
.h{font-family:CP;font-weight:600;font-size:15px;letter-spacing:.08em;fill:#8fe3ff}
.s{font-size:15px;fill:#93acc0}
.e{font-family:CP;font-weight:500;font-size:13px;fill:#ffb15c}
.c{font-family:CP;font-weight:500;font-size:13px;fill:#8fe3ff}
.box{fill:rgba(8,28,42,.75);stroke:rgba(143,227,255,.32);stroke-width:1}
.hot{stroke:#8fe3ff}
.amb{stroke:rgba(255,177,92,.6)}
.ln{stroke:#8fe3ff;stroke-width:1.5;fill:none}
.lo{stroke:#ffb15c;stroke-width:1.5;fill:none}
.dash{stroke-dasharray:4 5}
</style></head><body>
<svg width="1600" height="900" viewBox="0 0 1600 900">
<defs>
 <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fe3ff"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffb15c"/></marker>
 <radialGradient id="glow"><stop offset="0" stop-color="#ffe2bd" stop-opacity=".9"/><stop offset=".35" stop-color="#ffb15c" stop-opacity=".35"/><stop offset="1" stop-color="#ffb15c" stop-opacity="0"/></radialGradient>
</defs>

<text x="70" y="78" class="t" style="font-size:30px">How Jarvis HUD works</text>
<text x="70" y="108" class="s" style="font-size:17px">One small JSON protocol over WebSocket. Swap the backend, keep the HUD.</text>

<!-- Browser HUD -->
<path class="box hot" d="M70 160h430l20 20v560H90l-20-20z"/>
<text x="96" y="196" class="h">BROWSER  /  HUD</text>
<g transform="translate(96,222)">
 <rect class="box" width="398" height="70"/><text x="16" y="29" class="t" style="font-size:17px">Microphone</text>
 <text x="16" y="52" class="s">Analyser level + spectrum, PCM16 24 kHz tap</text>
</g>
<g transform="translate(96,306)">
 <rect class="box" width="398" height="70"/><text x="16" y="29" class="t" style="font-size:17px">Speech input</text>
 <text x="16" y="52" class="s">Web Speech API text, or raw audio to the relay</text>
</g>
<g transform="translate(96,390)">
 <rect class="box" width="398" height="70"/><text x="16" y="29" class="t" style="font-size:17px">State reducer</text>
 <text x="16" y="52" class="s">Pure (state, event) to state. Unit tested.</text>
</g>
<g transform="translate(96,474)">
 <rect class="box amb" width="398" height="150"/>
 <circle cx="80" cy="75" r="60" fill="url(#glow)"/>
 <circle cx="80" cy="75" r="44" fill="none" stroke="#ffb15c" stroke-opacity=".55"/>
 <circle cx="80" cy="75" r="54" fill="none" stroke="#ffb15c" stroke-opacity=".25" stroke-dasharray="2 4"/>
 <text x="160" y="58" class="t" style="font-size:17px">Neural core</text>
 <text x="160" y="82" class="s">Canvas, additive light,</text>
 <text x="160" y="104" class="s">reacts to mic and voice level</text>
</g>
<g transform="translate(96,638)">
 <rect class="box" width="190" height="80"/><text x="14" y="32" class="t" style="font-size:16px">Transcript</text><text x="14" y="56" class="s">streamed deltas</text>
 <rect class="box" x="208" width="190" height="80"/><text x="222" y="32" class="t" style="font-size:16px">Tool cards</text><text x="222" y="56" class="s">args, result, ms</text>
</g>

<!-- Protocol bus -->
<g transform="translate(600,160)">
 <text x="0" y="36" class="h">WEBSOCKET  /ws</text>
 <line x1="-78" y1="110" x2="388" y2="110" class="ln" marker-end="url(#ac)"/>
 <text x="0" y="98" class="c">user_text · audio · audio_commit · interrupt</text>
 <line x1="388" y1="180" x2="-78" y2="180" class="lo" marker-end="url(#ao)"/>
 <text x="0" y="168" class="e">meta · state · transcript · level · audio</text>
 <line x1="388" y1="230" x2="-78" y2="230" class="lo" marker-end="url(#ao)"/>
 <text x="0" y="218" class="e">tool_call · tool_result · error</text>
 <g transform="translate(0,290)">
  <rect class="box" width="300" height="250"/>
  <text x="18" y="34" class="h">STATES</text>
  <g font-family="CP" font-size="15">
   <circle cx="30" cy="72" r="5" fill="#6eb2d6"/><text x="48" y="77" class="s">idle</text>
   <circle cx="30" cy="112" r="5" fill="#8fe3ff"/><text x="48" y="117" class="s">listening</text>
   <circle cx="30" cy="152" r="5" fill="#c7defa"/><text x="48" y="157" class="s">thinking</text>
   <circle cx="30" cy="192" r="5" fill="#ffb15c"/><text x="48" y="197" class="s">speaking</text>
  </g>
  <text x="150" y="77" class="s">ice glow, slow spin</text>
  <text x="150" y="117" class="s">ripples follow mic</text>
  <text x="150" y="157" class="s">scanner sweep</text>
  <text x="150" y="197" class="s">ember, spectrum</text>
 </g>
</g>

<!-- Backends -->
<text x="1000" y="196" class="h">BACKENDS  (pick one)</text>
<g transform="translate(1000,222)">
 <path class="box amb" d="M0 0h510l20 20v150H0z"/>
 <text x="20" y="34" class="t" style="font-size:18px">jarvis-hud serve  /  mock</text>
 <text x="20" y="62" class="s">AgentSession: provider + local tools loop</text>
 <text x="20" y="98" class="c">OpenAI · OpenRouter · Groq · Ollama · LM Studio</text>
 <text x="20" y="122" class="c">Anthropic · mock (offline, labeled simulated)</text>
 <text x="20" y="152" class="s">Tools: get_time, calculate, system_status, save_note</text>
</g>
<g transform="translate(1000,412)">
 <path class="box" d="M0 0h510l20 20v130H0z"/>
 <text x="20" y="34" class="t" style="font-size:18px">jarvis-hud relay</text>
 <text x="20" y="62" class="s">Mic PCM16 to OpenAI Realtime, voice back as audio.</text>
 <text x="20" y="86" class="s">Key stays on the server. Function calls run locally.</text>
 <text x="20" y="122" class="c">mapRealtimeEvent(): GA and beta event names</text>
</g>
<g transform="translate(1000,582)">
 <path class="box dash" d="M0 0h530v136H0z"/>
 <text x="20" y="34" class="t" style="font-size:18px">Your own server</text>
 <text x="20" y="62" class="s">Any language. Emit the same JSON events and</text>
 <text x="20" y="86" class="s">open the HUD with ?ws=wss://your-host/ws</text>
 <text x="20" y="118" class="c">Pipecat · LiveKit · custom agents</text>
</g>
<text x="70" y="830" class="s" style="font-size:14px;fill:#5c7384">Diagram of the code in this repository: src/protocol.ts, src/state/store.ts, src/viz/core.ts, server/session.ts, server/relay.ts</text>
</svg></body></html>
